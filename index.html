<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>A Surprise Awaits</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="gifts.css" />
    <style>
      /* ---- same background as the other pages ---- */
      :root {
        --ivory: #f6f1e7;
        --ivory-dim: #e3cfc6;
        --ink: #2b0a10;
        --gold: #d8b45c;
        --gold-soft: #f0d99a;
      }
      body {
        background: linear-gradient(
          135deg,
          #3a0711,
          #6a1020,
          #4a0a16,
          #7a1626,
          #3a0711
        );
        background-size: 400% 400%;
        background-attachment: fixed;
        animation: bg 22s ease-in-out infinite;
      }
      @keyframes bg {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        z-index: -1;
      }
      body::before {
        width: 380px;
        height: 380px;
        background: rgba(216, 180, 92, 0.2);
        top: -110px;
        left: -90px;
        animation: orb1 14s ease-in-out infinite;
      }
      body::after {
        width: 440px;
        height: 440px;
        background: rgba(200, 50, 70, 0.28);
        bottom: -150px;
        right: -110px;
        animation: orb2 17s ease-in-out infinite;
      }
      @keyframes orb1 {
        50% {
          transform: translate(90px, 70px);
        }
      }
      @keyframes orb2 {
        50% {
          transform: translate(-90px, -60px);
        }
      }
      #spot {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        background: radial-gradient(
          420px circle at var(--mx, 70%) var(--my, 40%),
          rgba(255, 190, 120, 0.2),
          transparent 60%
        );
      }
      #sparks {
        display: none;
      }
      #bgsp {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
      }
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        opacity: 0.07;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      }
    </style>
    <style>
      .cd {
        display: flex;
        gap: clamp(8px, 2.6vw, 16px);
        justify-content: center;
        margin: 6px 0 16px;
      }
      .u {
        min-width: clamp(62px, 19vw, 92px);
        padding: clamp(10px, 2vh, 16px) 6px;
        border-radius: 20px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.04)
        );
        border: 1.5px solid rgba(240, 217, 154, 0.45);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        animation: in 0.9s both;
      }
      .u b {
        display: block;
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: clamp(2rem, min(9vw, 6vh), 3rem);
        line-height: 1;
        color: var(--gold-soft);
        font-variant-numeric: tabular-nums;
      }
      .u i {
        font-size: 0.72rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #ecdccf;
        font-style: normal;
      }
      .note {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: clamp(1.05rem, 3.6vw, 1.35rem);
        color: var(--gold-soft);
        max-width: 420px;
        animation: in 0.9s 1s both;
        opacity: 0;
      }
      .pulse .u b {
        animation: hint 0.8s ease-in-out infinite;
      }
      #lock.gone {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="spot" aria-hidden="true"></div>
    <canvas id="sparks" aria-hidden="true"></canvas>
    <canvas id="bgsp" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <canvas
      id="fw"
      style="
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      "
    ></canvas>
    <div class="wrap">
      <div class="eyebrow" id="ey">a little surprise for</div>
      <h1 id="h">Bhuvan</h1>
      <div id="lock">
        <div class="cd" id="cd">
          <div class="u"><b id="d">00</b><i>days</i></div>
          <div class="u"><b id="hh">00</b><i>hours</i></div>
          <div class="u"><b id="mm">00</b><i>mins</i></div>
          <div class="u"><b id="ss">00</b><i>secs</i></div>
        </div>
        <div class="note">Your surprise opens at 12:00 AM on 10 December ♥</div>
      </div>
      <div class="msg" id="m">Something special is waiting for you…</div>
      <div class="btns" id="b">
        <a class="btn gold" href="Happy_Birthday_Page_0.html" data-nav
          >Open it ♥</a
        >
      </div>
    </div>
    <script src="gifts.js"></script>
    <script src="music.js"></script>
    <script>
      /* Birthday moment: 10 Dec 2026, 12:00 AM India time (IST, +05:30). Change the offset if he lives elsewhere. */
      var T = new Date("2026-12-10T00:00:00+05:30").getTime();
     
      // var T = Date.now() + 40 * 1000; // test: reveal 40 seconds after loading

      /* The page he lands on when the countdown ends */
      var NEXT = "Happy_Birthday_Welcome.html";
      /* Open index.html?preview to skip the countdown while you test it */
      var preview = location.search.indexOf("preview") > -1;
      var $ = function (i) {
          return document.getElementById(i);
        },
        p2 = function (n) {
          return (n < 10 ? "0" : "") + n;
        },
        leaving = false,
        timer;

      /* true when he was already waiting here at midnight -> full celebration on the next page */
      var loadedLocked = T - Date.now() > 0 && !preview;

      /* ---- fireworks (used for the in-place reveal) ---- */
      var fwc = $("fw"),
        fwx = fwc.getContext("2d"),
        F = [];
      function fwsize() {
        fwc.width = innerWidth;
        fwc.height = innerHeight;
      }
      fwsize();
      addEventListener("resize", fwsize);
      function burst() {
        var x = fwc.width * (0.15 + Math.random() * 0.7),
          y = fwc.height * (0.1 + Math.random() * 0.45),
          h = Math.random() * 70 + 20;
        for (var k = 0; k < 60; k++) {
          var a = (k / 60) * 6.28,
            sp = 1.5 + Math.random() * 3.4;
          F.push({
            x: x,
            y: y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            l: 1,
            h: h,
          });
        }
      }
      (function fwdraw() {
        fwx.clearRect(0, 0, fwc.width, fwc.height);
        F = F.filter(function (p) {
          return p.l > 0;
        });
        F.forEach(function (p) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.04;
          p.vx *= 0.985;
          p.l -= 0.013;
          fwx.fillStyle = "hsla(" + p.h + ",90%,70%," + p.l + ")";
          fwx.beginPath();
          fwx.arc(p.x, p.y, 2.3, 0, 6.28);
          fwx.fill();
        });
        requestAnimationFrame(fwdraw);
      })();

      /* he was waiting here at midnight: reveal on THIS page so the music never stops */
      function reveal() {
        document.title = "Happy Birthday, Bhuvan!";
        $("ey").textContent = "the moment has arrived";
        $("h").textContent = "Happy Birthday, Bhuvan!";
        $("lock").classList.add("gone");
        $("m").textContent = "Your surprise is ready. \u2665";
        $("m").classList.add("show");
        setTimeout(function () {
          $("b").classList.add("show");
        }, 2200);
        var n = 0,
          iv = setInterval(function () {
            burst();
            if (++n > 14) clearInterval(iv);
          }, 350);
        burst();
        if (window.G && G.hearts) G.hearts($("h"), 30, "\uD83C\uDF89");
        if (navigator.vibrate) navigator.vibrate([80, 40, 120]);
      }

      function go(celebrate) {
        if (leaving) return;
        leaving = true;
        clearInterval(timer);
        if (celebrate && !preview) {
          reveal();
          return;
        }
        document.body.style.transition = "opacity .7s";
        document.body.style.opacity = "0";
        setTimeout(function () {
          location.href = NEXT + (preview ? "?preview" : "");
        }, 700);
      }

      function tick() {
        var r = T - Date.now();
        if (r <= 0 || preview) {
          go(loadedLocked);
          return;
        }
        var s = Math.floor(r / 1000);
        $("d").textContent = p2(Math.floor(s / 86400));
        $("hh").textContent = p2(Math.floor((s % 86400) / 3600));
        $("mm").textContent = p2(Math.floor((s % 3600) / 60));
        $("ss").textContent = p2(s % 60);
        $("cd").classList.toggle("pulse", r < 60000);
      }
      tick();
      if (!leaving) timer = setInterval(tick, 250);
    </script>
    <script>
      /* floating sparkles + moving spotlight (same as the other pages) */
      (function () {
        var cv = document.getElementById("bgsp"),
          cx = cv.getContext("2d"),
          W,
          H,
          P = [];
        function size() {
          W = cv.width = innerWidth;
          H = cv.height = innerHeight;
        }
        addEventListener("resize", size);
        size();
        function spark(y) {
          return {
            x: Math.random() * W,
            y: y === undefined ? H + 20 : y,
            r: 1.5 + Math.random() * 5,
            v: 0.25 + Math.random() * 0.7,
            sw: Math.random() * 6.28,
            sp: 0.01 + Math.random() * 0.02,
            a: 0.15 + Math.random() * 0.5,
            t: Math.random() * 6.28,
          };
        }
        for (var i = 0; i < 45; i++) P.push(spark(Math.random() * H));
        (function draw() {
          cx.clearRect(0, 0, W, H);
          for (var i = 0; i < P.length; i++) {
            var p = P[i];
            p.y -= p.v;
            p.sw += p.sp;
            p.x += Math.sin(p.sw) * 0.4;
            p.t += 0.03;
            if (p.y < -20) {
              P[i] = spark();
              continue;
            }
            var al = p.a * (0.6 + 0.4 * Math.sin(p.t)),
              g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
            g.addColorStop(0, "rgba(255,225,160," + al + ")");
            g.addColorStop(1, "rgba(255,225,160,0)");
            cx.fillStyle = g;
            cx.beginPath();
            cx.arc(p.x, p.y, p.r * 3, 0, 6.28);
            cx.fill();
          }
          requestAnimationFrame(draw);
        })();

        var last = 0;
        function move(x, y) {
          document.documentElement.style.setProperty("--mx", x + "px");
          document.documentElement.style.setProperty("--my", y + "px");
        }
        addEventListener("pointermove", function (e) {
          last = Date.now();
          move(e.clientX, e.clientY);
        });
        setInterval(function () {
          if (Date.now() - last < 2500) return;
          var t = Date.now() / 1600;
          move(
            innerWidth * (0.6 + 0.25 * Math.sin(t)),
            innerHeight * (0.42 + 0.12 * Math.cos(t * 0.8)),
          );
        }, 40);
      })();
    </script>
  </body>
</html>
